[project]
name = "przeczytai-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.40",
  "edge-tts>=7.2.8,<8",
  "fastapi>=0.120",
  "mangum>=0.19",
  "mutagen>=1.47",
  "openai>=2.0,<3",
  "pydantic-settings>=2.8",
  "ulid-py>=1.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mutagen>=1.47",
  "python-dotenv>=1.2",
  "pytest>=8.3",
  # Upper bound is deliberate: ruff 0.16 enables rules (notably B008 on
  # FastAPI's Depends idiom, used by every route in this repo) that flag 66
  # pre-existing issues on main. Unpinning made CI fail spontaneously the day
  # 0.16 shipped, on a branch that changed none of the offending code.
  "ruff>=0.8,<0.16",
  "uvicorn[standard]>=0.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
