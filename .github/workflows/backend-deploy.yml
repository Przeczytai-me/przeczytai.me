name: Deploy backend to dev

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: backend-deploy-dev
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "638175212741"
  AWS_REGION: eu-west-1
  DEPLOY_ROLE_ARN: arn:aws:iam::638175212741:role/przeczytai-me-github-deploy-dev
  ECR_REPOSITORY: 638175212741.dkr.ecr.eu-west-1.amazonaws.com/przeczytai-me-dev-processor
  PROCESSOR_IMAGE_TAG: processor-${{ github.sha }}
  TF_DIR: infrastructure/environments/dev
  TF_IN_AUTOMATION: "true"

jobs:
  test:
    name: Deployment gate
    if: startsWith(github.ref_name, 'v')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        working-directory: backend
        run: ruff check .

      - name: Run backend unit tests
        working-directory: backend
        run: pytest -q

  deploy:
    name: Build and deploy
    needs: test
    if: startsWith(github.ref_name, 'v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: backend-deploy-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Initialize and validate Terraform
        run: |
          terraform -chdir="$TF_DIR" init -input=false
          terraform -chdir="$TF_DIR" validate

      - name: Ensure the processor repository exists
        run: >-
          terraform -chdir="$TF_DIR" apply
          -auto-approve
          -input=false
          -target=aws_ecr_repository.processor

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Blacksmith Docker layer cache
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push processor image
        uses: useblacksmith/build-push-action@v2
        with:
          context: backend
          file: backend/Dockerfile.processor
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.PROCESSOR_IMAGE_TAG }}
          provenance: false
          sbom: false

      - name: Apply backend infrastructure and code
        env:
          TF_VAR_processor_image_tag: ${{ env.PROCESSOR_IMAGE_TAG }}
        run: terraform -chdir="$TF_DIR" apply -auto-approve -input=false

      - name: Smoke-test public health endpoint
        run: |
          API_BASE_URL=$(terraform -chdir="$TF_DIR" output -raw api_base_url)
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$API_BASE_URL/api/v1/health"

      - name: Write deployment summary
        if: success()
        run: |
          API_BASE_URL=$(terraform -chdir="$TF_DIR" output -raw api_base_url)
          {
            echo "## Backend deployment complete"
            echo
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Processor image: \`$ECR_REPOSITORY:$PROCESSOR_IMAGE_TAG\`"
            echo "- API: $API_BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
