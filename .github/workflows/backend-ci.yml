name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "infrastructure/**"
      - ".github/workflows/backend-*.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infrastructure/**"
      - ".github/workflows/backend-*.yml"

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        working-directory: backend
        run: ruff check .

      - name: Run backend unit tests
        working-directory: backend
        run: pytest -q

  terraform:
    name: Terraform checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure

      - name: Validate bootstrap Terraform
        run: |
          terraform -chdir=infrastructure/environments/bootstrap init -backend=false -input=false
          terraform -chdir=infrastructure/environments/bootstrap validate

      - name: Validate dev Terraform
        run: |
          terraform -chdir=infrastructure/environments/dev init -backend=false -input=false
          terraform -chdir=infrastructure/environments/dev validate
